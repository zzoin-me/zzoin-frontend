name: PR Lint Check

on:
  pull_request:

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: dep
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm run lint
